<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — InventorySys</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body onload="displayItems()">

<nav class="navbar">
  <div class="logo">InventorySystem</div>
  <ul class="nav-links">
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="inventory.html" class="active">Inventory</a></li>
    <li><a href="tracking.html">Tracking</a></li>
    <li><a href="login.html">Logout</a></li>
  </ul>
</nav>

<div class="container">

  <div class="page-header fade-up">
    <h2>Equipment <span>Inventory</span></h2>
    <p>Add, search and manage all equipment records</p>
  </div>

  <div class="inv-top">
    <div class="card fade-up delay-1">
      <div class="section-title">Add Equipment</div>
      <input type="text" id="itemName" placeholder="Equipment name">
      <input type="text" id="itemLocation" placeholder="Location / Room">
      <select id="itemStatus">
        <option value="Available">Available</option>
        <option value="Lost">Lost</option>
      </select>
      <input type="file" id="itemImage" accept="image/*">
      <button onclick="addItem()">+ Add Equipment</button>
    </div>

    <div class="card fade-up delay-2" style="align-self:start">
      <div class="section-title">Search Equipment</div>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search by name or location…" oninput="searchItem()">
      </div>
      <div id="searchCount" style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:10px;"></div>
    </div>
  </div>

  <div class="card fade-up delay-3">
    <div class="section-title">All Equipment</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Location</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-icon">📭</div>
      <p>No equipment found. Add some above!</p>
    </div>
  </div>

</div>

<!-- Borrow Modal -->
<div class="modal-overlay" id="borrowModal">
  <div class="modal-card fade-up">
    <div class="modal-header">
      <div class="section-title" style="margin-bottom:0">Register Borrow</div>
      <button class="modal-close" onclick="closeBorrowModal()">✕</button>
    </div>

    <input type="hidden" id="borrowItemIndex">

    <label class="modal-label">Student Name</label>
    <input type="text" id="borrowStudent" placeholder="Full name of student">

    <label class="modal-label">Time Taken</label>
    <input type="text" id="borrowTime" placeholder="e.g. 10:30 AM or 2 hours">

    <label class="modal-label">Return By Date</label>
    <input type="date" id="borrowReturnDate">

    <p id="modalError" style="color:#f87171;font-size:13px;min-height:20px;margin-top:4px"></p>

    <div style="display:flex;gap:12px;margin-top:8px">
      <button onclick="confirmBorrow()" style="flex:1">Confirm Borrow</button>
      <button onclick="closeBorrowModal()" style="flex:1;background:rgba(255,255,255,0.08);color:white">Cancel</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
