<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body onload="displayItems()">

<nav class="navbar">

  <div class="logo">InventorySys</div>

  <ul class="nav-links">
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="inventory.html">Inventory</a></li>
    <li><a href="login.html">Logout</a></li>
  </ul>

</nav>

<div class="container">

  <div class="card">

    <h2>Add Equipment</h2>

    <input type="text" id="itemName" placeholder="Equipment Name">

    <input type="text" id="itemLocation" placeholder="Location">

    <select id="itemStatus">
      <option value="Available">Available</option>
      <option value="Lost">Lost</option>
    </select>
 <input type="file" id="itemImage" accept="image/*">

    <button onclick="addItem()">Add Item</button>

  </div>

  <div class="card">

    <h2>Search Equipment</h2>

    <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="searchItem()">

  </div>

  <div class="card">

    <h2>Inventory List</h2>

    <table>

      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Location</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="inventoryBody"></tbody>

    </table>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
