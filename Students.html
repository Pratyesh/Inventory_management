<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — InventorySys</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="logo">InventorySys</div>
  <ul class="nav-links">
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="inventory.html">Inventory</a></li>
    <li><a href="tracking.html">Tracking</a></li>
    <li><a href="students.html" class="active">Students</a></li>
    <li><a href="audit.html">Audit</a></li>
    <li><a href="login.html">Logout</a></li>
  </ul>
  <div class="nav-right">
    <span id="userBadge" class="user-badge"></span>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">☀️</button>
  </div>
</nav>

<div id="toastWrap"></div>

<div class="container">
  <div class="page-header fade-up">
    <h2>Student <span>Borrow History</span></h2>
    <p>Search a student to see everything they've borrowed, on time or late</p>
  </div>

  <div class="card fade-up delay-1" style="margin-bottom:20px">
    <div class="search-wrap">
      <input type="text" id="studentSearch" placeholder="Search by student name or ID…" oninput="loadStudentHistory()">
    </div>
  </div>

  <div id="studentStats" class="student-stats fade-up delay-2"></div>

  <div class="card fade-up delay-3">
    <div class="section-title">Borrow Records</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Equipment</th><th>Student</th><th>Qty</th>
            <th>Borrowed On</th><th>Due Date</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="studentHistoryBody">
          <tr><td colspan="6" style="text-align:center;color:rgba(var(--text-rgb),0.4);padding:20px">Start typing a student name or ID above</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  document.getElementById('userBadge') && showUserBadge();
  const tb = localStorage.getItem('theme')==='light';
  document.getElementById('themeToggle').textContent = tb ? '🌙' : '☀️';
</script>
</body>
</html>
